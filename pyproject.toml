[project]
name = "local-modular-rag"
version = "0.1.0"
description = "A fully local, modular, and experiment-friendly RAG pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RAG Developer" }]

dependencies = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "FlagEmbedding>=1.2.0",
    "sentence-transformers>=2.2.2",
    "unstructured>=0.12.0",
    "pdfplumber>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "nltk>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.28.0",
    "streamlit-chat>=0.1.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
