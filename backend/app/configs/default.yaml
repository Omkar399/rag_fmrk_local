# Default RAG Pipeline Configuration
# Balanced performance with best-in-class components
# Now configured for LM Studio local inference

loader:
  component: "load.fs"
  args:
    data_dir: "data"

chunker:
  component: "chunk.smart-boundary"
  args:
    chunk_size_tokens: 450
    overlap_percentage: 0.12
    model_name: "sentence-transformers/all-MiniLM-L6-v2"

embedder:
  component: "embed.hf"
  args:
    model_name: "BAAI/bge-small-en-v1.5"

store:
  component: "store.chroma"
  args:
    path: "./chroma_db"
    collection_name: "documents"

retriever:
  component: "retriever.hybrid"
  args:
    dense_top_k: 15       # Reduced from 40 - already highly relevant
    sparse_top_k: 15      # Reduced from 40
    fused_top_k: 5        # Reduced from 10 - we only need top 5
    rrf_constant: 60

reranker:
  component: "rerank.noop"  # Skip expensive BGE reranking - embeddings already good!
  args:
    top_k: 5

compressor:
  component: "compress.sentences"
  args:
    token_budget: 6000

# LM Studio Configuration - OPTIMIZED FOR SPEED
generator:
  component: "gen.lmstudio"
  args:
    model: "qwen2.5-7b-instruct-1m"
    base_url: "http://127.0.0.1:1234"
    timeout: 120
    max_tokens: 300        # ⚡ Reduced from 1000 - 50-70% faster, answers still excellent
    temperature: 0.2       # ⚡ Reduced from 0.7 - tighter answers, faster decoding

prompt:
  system: |
    You are a careful, knowledgeable assistant.
    Answer questions based only on the provided context.
    If the context doesn't contain relevant information, say you don't know.
    Cite sources from the context when possible.
